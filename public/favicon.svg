<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente Externo da Íris de Argus -->
    <linearGradient id="irisRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Gradiente do Núcleo da Pupila Cognitiva -->
    <radialGradient id="pupilCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glow Neon Suave -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente da Mira Psicométrica TRI -->
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Círculo Base Transparente com Disco Escuro Orgânico Interno (sem bordas quadradas) -->
  <circle cx="256" cy="256" r="248" fill="#060914" />
  <circle cx="256" cy="256" r="248" fill="url(#neonGlow)" />

  <!-- Anel 1: Órbita Externa Guia com Nós de Rede Neural -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#irisRingGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="256" cy="28" r="6" fill="#38bdf8" filter="url(#glowFilter)" />
  <circle cx="484" cy="256" r="6" fill="#06b6d4" filter="url(#glowFilter)" />
  <circle cx="256" cy="484" r="6" fill="#10b981" filter="url(#glowFilter)" />
  <circle cx="28" cy="256" r="6" fill="#3b82f6" filter="url(#glowFilter)" />

  <!-- Anel 2: Escudo Protetor e Segmentos de Precisão -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#0284c7" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#irisRingGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="120 40 80 40" filter="url(#glowFilter)" />

  <!-- Anel 3: Anel Psicométrico Interior -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Eixo Reticular / Mira de Precisão TRI (4 marcas cardeais) -->
  <line x1="256" y1="90" x2="256" y2="120" stroke="url(#reticleGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="392" x2="256" y2="422" stroke="url(#reticleGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="90" y1="256" x2="120" y2="256" stroke="url(#reticleGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="392" y1="256" x2="422" y2="256" stroke="url(#reticleGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Pupila Central de Alta Cognição -->
  <circle cx="256" cy="256" r="92" fill="url(#pupilCoreGrad)" filter="url(#glowFilter)" />

  <!-- Brilho Especular da Córnea (Reflexo Esférico) -->
  <ellipse cx="226" cy="220" rx="32" ry="20" transform="rotate(-30 226 220)" fill="#ffffff" opacity="0.85" />
  <circle cx="286" cy="276" r="10" fill="#38bdf8" opacity="0.9" />

  <!-- Ponto Focal Onisciente Central -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" filter="url(#glowFilter)" />
</svg>
